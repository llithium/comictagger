name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  LC_COLLATE: en_US.UTF-8
  QT_QPA_PLATFORM: offscreen
  TOX_OVERRIDE: 'testenv.install_command=python -I -m pip install --only-binary PyQt6 --only-binary PyQt6-WebEngine {opts} {packages}'

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            setup.cfg
            pyproject.toml

      - name: Install macOS dependencies
        run: |
          brew install icu4c pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$(brew --prefix icu4c)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix icu4c)/sbin" >> "$GITHUB_PATH"

      - name: Install tox
        run: python -m pip install --upgrade tox

      - name: Run validation matrix
        run: python -m tox p

      - name: Build release artifacts
        if: matrix.python-version == '3.14'
        run: python -m tox r -m build

      - name: Archive production artifacts
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: ComicTagger-macOS-arm64
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/binary/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ComicTagger-macOS-arm64
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/binary/*.dmg \
            --verify-tag --title "$RELEASE_TAG" --generate-notes "${release_flags[@]}"
